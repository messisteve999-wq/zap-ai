<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2b2e">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<title>zap-ai</title>
<style>
:root{--bg:#0d2b2e;--panel:#14393d;--ink:#f4f1ea;--mut:#9bb8ba;--acc:#f2c14e;--ok:#25d366}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:24px 0 80px}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:.02em}h2{font-size:1.1rem;margin:28px 0 10px}
p{color:var(--mut);margin:0 0 16px}
input{width:100%;padding:14px;border-radius:10px;border:2px solid var(--panel);background:#0a2124;color:var(--ink);font:inherit}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button,.btn{display:inline-block;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;color:#0d2b2e;background:var(--acc)}
.go{width:100%;margin-top:10px;background:var(--ok)}
.cats{display:grid;gap:10px}.cat{background:var(--panel);color:var(--ink);text-align:left;border:2px solid transparent}
.cat[aria-pressed=true]{border-color:var(--acc)}
.hint{font-size:.9rem}
.win{position:fixed;z-index:10;width:min(92vw,380px);max-height:44vh;display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--acc);border-radius:14px;box-shadow:0 10px 30px #0008}
.wh{display:flex;gap:6px;align-items:center;padding:8px;cursor:grab;touch-action:none;border-bottom:1px solid #ffffff22}
.wh select{flex:1;min-width:0;padding:8px;border-radius:8px;border:0;background:#0a2124;color:var(--ink);font:inherit}
.x{background:#0a2124;color:var(--ink);padding:8px 12px}
.wb{overflow:auto;padding:8px}
.it{display:flex;gap:8px;align-items:flex-start;padding:8px 4px;border-bottom:1px solid #ffffff14}
.it span{flex:1;font-size:.95rem}.it button{padding:6px 10px;font-size:.85rem}
.wf{padding:8px;font-size:.8rem;color:var(--mut);display:flex;justify-content:space-between;gap:8px;align-items:center}
.wf a{color:var(--acc)}
@media (prefers-reduced-motion:no-preference){.win{animation:in .15s ease-out}@keyframes in{from{opacity:0;transform:scale(.97)}}}
</style></head><body>
<main>
<h1>zap-ai</h1><p>STEVE · saisis un numéro, ouvre l'aperçu du profil WhatsApp.</p>
<label for="num" class="hint">Numéro avec indicatif (ex. 237670000000)</label>
<input id="num" inputmode="tel" autocomplete="off" placeholder="237…">
<button class="go" id="go">Ouvrir l'aperçu WhatsApp</button>
<h2>Catalogues</h2>
<p class="hint">Touche une catégorie pour ouvrir sa fenêtre flottante. Deux fenêtres au maximum ; la plus ancienne se ferme quand tu en ouvres une troisième.</p>
<div class="cats" id="cats"></div>
<p class="hint" style="margin-top:20px">Les messages et questions changent automatiquement toutes les 2 heures.</p>
</main>
<script src="data.js"></script>
<script>
const SLOT=2*60*60*1000, MAX=2, KEY="zap-ai-fenetres";
const keys=Object.keys(CATALOGUES);
let wins=[];try{wins=JSON.parse(localStorage.getItem(KEY)||"[]").filter(w=>CATALOGUES[w.cat]).slice(-MAX)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(wins))}catch(e){}};
const slot=()=>Math.floor(Date.now()/SLOT);
// mélange déterministe : même liste pendant 2 h, nouvelle liste ensuite
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pick(cat){const a=[...CATALOGUES[cat].items],r=rng(slot()*31+keys.indexOf(cat)*7919);
 for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,10)}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function openWin(cat){
 const ex=wins.find(w=>w.cat===cat);if(ex){wins=wins.filter(w=>w!==ex);wins.push(ex)}
 else{wins.push({cat,x:12+wins.length*10,y:wins.length?Math.round(innerHeight*.5):70});while(wins.length>MAX)wins.shift()}
 save();render()}
function closeWin(i){wins.splice(i,1);save();render()}
function switchCat(i,cat){const o=wins.findIndex((w,k)=>k!==i&&w.cat===cat);
 if(o>-1){wins[o].cat=wins[i].cat}wins[i].cat=cat;save();render()}
function render(){
 document.getElementById("cats").innerHTML=keys.map(k=>`<button class="cat" data-c="${k}" aria-pressed="${wins.some(w=>w.cat===k)}">${esc(CATALOGUES[k].nom)}</button>`).join("");
 document.querySelectorAll(".win").forEach(e=>e.remove());
 wins.forEach((w,i)=>{
  const d=document.createElement("div");d.className="win";d.style.left=w.x+"px";d.style.top=w.y+"px";
  const next=new Date((slot()+1)*SLOT);
  d.innerHTML=`<div class="wh"><select aria-label="Changer de catégorie">${keys.map(k=>`<option value="${k}"${k===w.cat?" selected":""}>${esc(CATALOGUES[k].nom)}</option>`).join("")}</select><button class="x" aria-label="Fermer">✕</button></div>
  <div class="wb">${pick(w.cat).map(t=>`<div class="it"><span>${esc(t)}</span><button data-t="${esc(t)}">Copier</button></div>`).join("")}</div>
  <div class="wf"><span>Renouvelé à ${next.getHours()}h${String(next.getMinutes()).padStart(2,"0")}</span><a target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(CATALOGUES[w.cat].q)}">Chercher sur Google</a></div>`;
  d.querySelector("select").onchange=e=>switchCat(i,e.target.value);
  d.querySelector(".x").onclick=()=>closeWin(i);
  d.querySelectorAll(".it button").forEach(b=>b.onclick=async()=>{const t=b.dataset.t;
   try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}
   b.textContent="Copié";setTimeout(()=>b.textContent="Copier",1200)});
  const h=d.querySelector(".wh");
  h.onpointerdown=e=>{if(e.target.closest("select,button"))return;const sx=e.clientX-w.x,sy=e.clientY-w.y;h.setPointerCapture(e.pointerId);
   h.onpointermove=m=>{w.x=Math.max(0,Math.min(innerWidth-60,m.clientX-sx));w.y=Math.max(0,Math.min(innerHeight-60,m.clientY-sy));d.style.left=w.x+"px";d.style.top=w.y+"px"};
   h.onpointerup=()=>{h.onpointermove=null;save()}};
  document.body.appendChild(d)})}
document.getElementById("cats").onclick=e=>{const b=e.target.closest(".cat");if(b)openWin(b.dataset.c)};
document.getElementById("go").onclick=()=>{const n=document.getElementById("num").value.replace(/\D/g,"");
 if(n.length<8){alert("Saisis un numéro complet avec l'indicatif.");return}
 window.open("https://wa.me/"+n,"_blank","noopener")};
let last=slot();setInterval(()=>{if(slot()!==last){last=slot();render()}},30000);
document.addEventListener("visibilitychange",()=>{if(slot()!==last){last=slot();render()}});
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
